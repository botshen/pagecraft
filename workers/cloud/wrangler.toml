name = "pagecraft-cloud"
main = "src/index.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── Custom Domain (Self-Hosting) ────────────────────────────────────────────
# Replace `pagecraft.shenxin.space` with your own Cloudflare custom domain, or
# comment out `routes` below to deploy purely on `<name>.<subdomain>.workers.dev`.
routes = [
  { pattern = "pagecraft.shenxin.space", custom_domain = true },
]

# ─── D1 Database (install_secrets, install_quotas, rate_limits, llm_calls, feedback_daily, runtime_config) ─
# Self-hosters:
#   1. Run `pnpm d1:create` (or `npx wrangler d1 create pagecraft-cloud`)
#   2. Replace the placeholder `database_id` below with the UUID printed by Wrangler
#   3. Apply schema migrations: `pnpm d1:migrate:remote` (or `pnpm d1:migrate:local` for local dev)
[[d1_databases]]
binding = "DB"
database_name = "pagecraft-cloud"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
PRIMARY_LLM_BASE_URL = "https://api.deepseek.com/v1"
PRIMARY_LLM_MODEL = "deepseek-chat"
# Optional fallback daily global generation cap (default: 2000; overridable live in `/admin`):
# DAILY_GLOBAL_GEN_LIMIT = "2000"

# ─── Secrets (never commit real values; use `.dev.vars` locally and `wrangler secret put` in prod) ─
#   npx wrangler secret put ADMIN_TOKEN          # Required (>= 16 chars) for `/admin` & AES-GCM key encryption
#   npx wrangler secret put PRIMARY_LLM_API_KEY  # Upstream OpenAI-compatible API key (or set online in `/admin`)
