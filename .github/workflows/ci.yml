name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Extension & Cloud Worker Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            workers/cloud/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check extension
        run: pnpm compile

      - name: Run core unit tests
        run: pnpm test

      - name: Build production MV3 extension
        run: pnpm build

      - name: Install Cloud Worker dependencies
        run: pnpm --dir workers/cloud install --frozen-lockfile

      - name: Type-check Cloud Worker
        run: pnpm --dir workers/cloud typecheck

      - name: Run Cloud Worker tests
        run: pnpm --dir workers/cloud test
