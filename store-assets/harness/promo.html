<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PageCraft promo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --clay: #c6613f; --ink: #1d1b17; --ink-2: #4f4a43;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Inter", sans-serif;
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Songti SC", serif;
  }
  html, body { overflow: hidden; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .bg {
    background:
      radial-gradient(520px 300px at 92% 0%, rgba(217,119,87,0.22), transparent 70%),
      radial-gradient(480px 260px at 0% 100%, rgba(198,97,63,0.12), transparent 70%),
      linear-gradient(165deg, #fbf7f1 0%, #f2e8db 100%);
  }
  .tile { width: 66px; height: 66px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(40,20,10,0.12), 0 12px 28px -6px rgba(140,48,22,0.34); overflow: hidden; }
  .tile img { width: 100%; height: 100%; display: block; }
  .name { font-family: var(--serif); font-weight: 600; letter-spacing: -0.015em; }
  em { font-style: normal; color: var(--clay); }

  /* small 440x280 */
  .small { width: 440px; height: 280px; padding: 34px 34px; position: relative; }
  .small .row { display: flex; align-items: center; gap: 15px; }
  .small .name { font-size: 38px; line-height: 1; }
  .small .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; letter-spacing: 0.01em; }
  .small h2 { margin-top: 28px; font-size: 25px; line-height: 1.35; font-weight: 700; }
  .small .chips { margin-top: 16px; display: flex; gap: 8px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.8); color: var(--ink-2);
    box-shadow: 0 0 0 1px rgba(60,40,20,0.08); white-space: nowrap; }

  /* marquee 1400x560 */
  .marquee { width: 1400px; height: 560px; position: relative; overflow: hidden; }
  .marquee .left { position: absolute; left: 96px; top: 92px; width: 700px; }
  .marquee .row { display: flex; align-items: center; gap: 20px; }
  .marquee .tile { width: 82px; height: 82px; border-radius: 19px; }
  .marquee .tile img { width: 100%; height: 100%; }
  .marquee .name { font-size: 60px; line-height: 1; }
  .marquee .sub { font-size: 17px; color: var(--ink-2); margin-top: 8px; letter-spacing: 0.02em; }
  .marquee h2 { margin-top: 46px; font-size: 44px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  .marquee p { margin-top: 14px; font-size: 19px; color: var(--ink-2); line-height: 1.6; }
  .marquee .chips { margin-top: 28px; display: flex; gap: 10px; }
  .marquee .chip { font-size: 15px; padding: 7px 14px; }
  .marquee .shot { position: absolute; right: 110px; top: 54px; width: 400px; height: 560px; border-radius: 16px 16px 0 0; overflow: hidden;
    background: #f9f7f2; box-shadow: 0 0 0 1px rgba(40,25,10,0.1), 0 30px 70px -14px rgba(70,40,15,0.35); }
  .marquee .shot iframe { width: 400px; height: 640px; border: 0; display: block; }

  /* logo 300x300 */
  .logo { width: 300px; height: 300px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .logo img { width: 208px; height: 208px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  const kind = new URLSearchParams(location.search).get('kind') || 'small';
  const root = document.getElementById('root');
  const pending = new Set();
  const done = () => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { window.__ready = true; }, 200));
  window.__errors = [];
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.pcReady) return;
    if (e.data.error) window.__errors.push(e.data.error);
    pending.delete(e.data.id);
    if (!pending.size) done();
  });

  if (kind === 'small') {
    root.innerHTML = `
      <div class="small bg">
        <div class="row">
          <div class="tile"><img src="/icon/128.png" alt=""></div>
          <div><div class="name">PageCraft</div><div class="sub">网页工坊 · AI 去弹窗改样式与油猴脚本</div></div>
        </div>
        <h2>鼠标指哪改哪，<br><em>一句话改造任何网页</em></h2>
        <div class="chips"><span class="chip">点选元素</span><span class="chip">CSS / JS 双引擎</span><span class="chip">零后台监控</span></div>
      </div>`;
    done();
  } else if (kind === 'marquee') {
    pending.add('marquee');
    root.innerHTML = `
      <div class="marquee bg">
        <div class="left">
          <div class="row">
            <div class="tile"><img src="/icon/128.png" alt=""></div>
            <div><div class="name">PageCraft</div><div class="sub">AI Webpage Customizer &amp; Userscript Studio</div></div>
          </div>
          <h2>鼠标指哪改哪，<br><em>一句话改造任何网页</em></h2>
          <p>点选元素、说出需求，AI 即时生成 CSS 改造或油猴脚本，<br>兼容篡改猴 / 脚本猫，开箱送 10 次免费额度。</p>
          <div class="chips"><span class="chip">点选真实元素</span><span class="chip">CSS 秒生效</span><span class="chip">一键导出 .user.js</span><span class="chip">零后台监控</span></div>
        </div>
        <div class="shot"><iframe src="/panel.html?mock=hero&lang=zh&theme=light&fid=marquee"></iframe></div>
      </div>`;
  } else {
    root.innerHTML = `<div class="logo"><img src="/icon/128.png" alt=""></div>`;
    const img = root.querySelector('img');
    (img.complete ? Promise.resolve() : new Promise((r) => (img.onload = r))).then(done);
  }
})();
</script>
</body>
</html>
